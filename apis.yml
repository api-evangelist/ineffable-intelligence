aid: ineffable-intelligence
name: Ineffable Intelligence
description: >-
  Ineffable Intelligence is a frontier artificial intelligence research lab
  working toward superintelligence. The company is building a "superlearner" -
  a system designed to discover all knowledge from its own experience, from
  elementary motor skills through to profound intellectual breakthroughs -
  driven by reinforcement learning algorithms rather than learning from human
  data. Its stated mission is "making first contact with superintelligence,"
  which it believes can be built within years and must be built in a way that is
  beneficial to humanity. Ineffable Intelligence is backed by Lightspeed Venture
  Partners and was surfaced through that portfolio into the API Evangelist
  network. As a research lab it currently publishes a mission-and-beliefs
  website and a careers board, and does not expose a public API, developer
  portal, SDKs, or product APIs at this time.
